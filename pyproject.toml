[project]
name = "tickforge"
version = "0.1.0"
description = "Real-time crypto market-data infrastructure: L2 book reconstruction, microstructure analytics, and deterministic replay"
readme = "README.md"
authors = [
    { name = "Armaan-king", email = "ARMAAN002@e.ntu.edu.sg" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# `benchmarks/` is excluded on purpose: it takes seconds per run, and a suite
# you hesitate to run is a suite that stops catching things.
#   uv run pytest              the correctness suite
#   uv run pytest benchmarks/  the timings
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
]
